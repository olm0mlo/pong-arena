<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pong Arena">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icona-192.png">
<title>Pong Arena · Lobby</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Michroma&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080c;--p1:#0e131e;--p2:#0a0d14;--p3:#0e121b;--ln:#1a2130;--ln2:#243047;--ln3:#2d3749;--tx:#e8f4ff;--mu:#8d9bb0;--mu2:#c9d3e0;--cy:#3ff0ff;--pk:#ff4d8d;--pk2:#ff8fb6;--gd:#ffc94d;--gm:#5cf2ff;--gr:#5dffa0;--tr:#1d2433}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:'Chakra Petch',system-ui,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer;color:inherit;border:none;background:none;padding:0}
button:disabled{cursor:default}
.mi{font-family:Michroma,sans-serif}
.hidden{display:none!important}
#app{position:fixed;inset:0;max-width:480px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
/* barra risorse */
.top{flex-shrink:0;height:calc(62px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 10px 0;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--ln);background:var(--p2)}
.me{display:flex;align-items:center;gap:6px}
.lvbox{width:36px;height:36px;border-radius:9px;border:2px solid var(--cy);display:flex;align-items:center;justify-content:center;font-family:Michroma,sans-serif;font-size:14px;color:var(--cy);box-shadow:0 0 10px rgba(63,240,255,.35)}
.xp{width:46px;height:5px;border-radius:3px;background:var(--tr);overflow:hidden;margin-top:4px}.xp i{display:block;height:100%;background:var(--cy)}
.pill{display:flex;align-items:center;gap:4px;height:30px;padding:0 8px;border-radius:15px;background:#121724;border:1px solid #232b3c;font-size:13px;font-weight:700;white-space:nowrap}
.pill.g{padding-right:0}
.plus{width:30px;height:30px;border-radius:15px;background:var(--pk);color:#1a0610;font-size:20px;font-weight:700;line-height:1}
.sp{flex-grow:1}
/* contenuto */
#main{flex-grow:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.col{display:flex;flex-direction:column;gap:12px;padding:12px 12px 22px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.h{font-family:Michroma,sans-serif;font-size:13px;letter-spacing:.06em}
.hrow{display:flex;justify-content:space-between;align-items:baseline}
.small{font-size:12px;color:var(--mu)}
.tab{font-variant-numeric:tabular-nums}
.card{border-radius:12px;border:1px solid var(--ln2);background:var(--p1);color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:6px;position:relative;text-align:center}
.badge{position:absolute;top:-1px;left:-1px;right:-1px;font-size:10px;font-weight:700;padding:3px 2px;border-radius:12px 12px 0 0;background:var(--pk);color:#1a0610}
.bar{height:7px;border-radius:4px;background:var(--tr);overflow:hidden}.bar i{display:block;height:100%}
.bigbtn{border-radius:11px;font-size:15px;font-weight:700;height:48px}
/* arena */
.offer{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--pk);background:#1a0b14;text-align:left;box-shadow:0 0 16px rgba(255,77,141,.25)}
.oico{width:44px;height:44px;border-radius:10px;background:#2a0f1e;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.comet{border-radius:3px;background:linear-gradient(90deg,#fff6d6,#ffc94d,#ff7a3d);box-shadow:0 0 10px #ffc94d}
.show{position:relative;height:250px;border-radius:14px;border:1px solid var(--ln);background:var(--p2);overflow:hidden}
.show .tl{position:absolute;top:12px;left:14px;font-family:Michroma,sans-serif;font-size:11px;letter-spacing:.18em;color:var(--cy)}
.show .tr{position:absolute;top:12px;right:12px;font-size:11px;color:var(--mu)}
.show .bt{position:absolute;left:0;right:0;bottom:14px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 8px}
.chip{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;color:var(--mu2);border:1px solid #3a4558}
.smbtn{height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--ln3);background:#141a27;font-size:12px;font-weight:600}
canvas.pv{display:block}
.floaty{animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.dot{position:absolute;border-radius:50%;animation:rise 7s linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}25%{opacity:.9}100%{transform:translateY(-120px);opacity:0}}
.passbtn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--ln);background:var(--p3);text-align:left}
.tag{font-size:11px;font-weight:700;padding:3px 7px;border-radius:8px;background:var(--pk);color:#1a0610}
.chest{height:92px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px}
.play{height:78px;border-radius:16px;background:var(--cy);color:#04161a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 0 26px rgba(63,240,255,.45),inset 0 -5px 0 rgba(0,0,0,.18)}
.play:active{transform:translateY(2px)}
/* negozio */
.box{border-radius:14px;border:1px solid var(--ln2);background:var(--p1);padding:12px 14px;display:flex;gap:12px}
.pinkbox{border-color:var(--pk);background:#160a12;box-shadow:0 0 18px rgba(255,77,141,.2);flex-direction:column;gap:10px;padding:14px}
.odds{font-size:12px;line-height:1.5;color:var(--mu2);background:var(--p1);border:1px solid var(--ln2);border-radius:10px;padding:10px 12px}
/* barra */
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:4px;border-radius:12px;background:var(--p3);border:1px solid var(--ln)}
.seg button{height:40px;border-radius:9px;font-size:14px;font-weight:700;color:var(--mu)}
.seg button.on{background:var(--cy);color:#04161a}
.prev{height:84px;border-radius:12px;border:1px solid var(--ln);background:var(--p2);display:flex;align-items:center;justify-content:center}
.panel{border-radius:14px;border:1px solid var(--ln);background:var(--p2);padding:14px;display:flex;flex-direction:column;gap:12px}
.lvtrack{display:flex;align-items:center}
.lvtrack>div{flex-grow:1;display:flex;align-items:center}
.lvtrack .ln{flex-grow:1;height:3px}
.lvtrack .n{width:30px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-family:Michroma,sans-serif;font-size:11px;flex-shrink:0}
.stat .r{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.frag{flex-grow:1;height:16px;border-radius:8px;background:var(--tr);overflow:hidden;position:relative}
.frag i{display:block;height:100%}.frag span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.cats{display:flex;gap:6px}.cats button{flex-grow:1;height:36px;border-radius:18px;font-size:13px;font-weight:700;border:1px solid var(--ln2);background:var(--p1);color:#a9b8cc}
.cats button.on{border-color:var(--cy);background:#0f2a30;color:var(--cy)}
.sw{width:60px;height:12px;border-radius:4px;box-shadow:0 0 8px rgba(255,255,255,.12)}
/* pass */
.passhead{border-radius:14px;border:1px solid #3a2f12;background:#120f07;padding:14px;display:flex;flex-direction:column;gap:10px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr);gap:8px;align-items:center}
.tc{height:66px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px;font-size:12px;font-weight:700;text-align:center}
.tn{height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-family:Michroma,sans-serif;font-size:13px}
/* profilo */
.stbox{border-radius:12px;border:1px solid var(--ln);background:var(--p3);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
/* navigazione */
.nav{flex-shrink:0;height:calc(72px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid var(--ln);background:var(--p2)}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:700;color:var(--mu)}
.nav button.on{background:#121a28;color:var(--cy);box-shadow:inset 0 3px 0 var(--cy)}
.nav button{font-size:10px}
.nav .nd{position:absolute;top:10px;right:calc(50% - 18px);width:9px;height:9px;border-radius:5px}
/* finestre */
.veil{position:fixed;inset:0;max-width:480px;margin:0 auto;background:rgba(3,4,8,.84);display:flex;align-items:center;justify-content:center;padding:24px;z-index:20}
.modal{width:100%;border-radius:16px;border:1px solid var(--ln3);background:#0d111a;padding:20px;display:flex;flex-direction:column;gap:12px;text-align:center}
.modal .t{font-family:Michroma,sans-serif;font-size:17px}
.modal .l{font-size:14px}
.modal .nt{font-size:12px;color:var(--mu);line-height:1.4}
.btn2{height:44px;border-radius:11px;border:1px solid var(--ln3);color:var(--mu2);font-size:14px;font-weight:600}
/* baule */
#chest{flex-direction:column;gap:18px;background:rgba(3,4,8,.93)}
.cstage{position:relative;width:240px;height:190px}
.rays{position:absolute;left:20px;top:0;width:200px;height:200px;border-radius:100px;opacity:.5;animation:spin 6s linear infinite}
.burst{position:absolute;left:70px;top:50px;width:100px;height:100px;border-radius:50px;animation:burst .7s ease-out forwards}
.cbody{position:absolute;left:60px;top:70px;width:120px;height:100px}
.cbody.shake{animation:shake .4s ease-in-out infinite;transform-origin:50% 100%}
.lid{position:absolute;left:-4px;top:0;width:128px;height:38px;border-radius:22px 22px 6px 6px}
.lid.fly{animation:lid .5s ease-out forwards}
.cbase{position:absolute;left:0;top:36px;width:120px;height:64px;border-radius:6px 6px 10px 10px}
.lock{position:absolute;left:50px;top:28px;width:20px;height:22px;border-radius:4px;background:#1a1f2b}
.rw{height:100px;border-radius:12px;background:var(--p1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px;animation:pop .4s ease-out both}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(5deg)}}
@keyframes lid{to{transform:translateY(-70px) rotate(-28deg);opacity:0}}
@keyframes burst{0%{transform:scale(.2);opacity:1}100%{transform:scale(2.6);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}
/* novità: profilo, missioni, regali, grafico */
.ava{border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.ava .lv{position:absolute;right:-5px;bottom:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#07080c;border:1.5px solid var(--cy);color:var(--cy);font-family:Michroma,sans-serif;font-size:9px;display:flex;align-items:center;justify-content:center}
.avgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.avgrid button{position:relative;border-radius:14px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--ln2);background:var(--p1);font-size:10px;font-weight:700}
.avgrid button.on{border:2px solid var(--cy);box-shadow:0 0 12px rgba(63,240,255,.35)}
.inp{height:48px;border-radius:11px;border:1px solid var(--ln3);background:#0a0d14;color:var(--tx);font-family:inherit;font-size:17px;font-weight:600;padding:0 14px;width:100%;outline:none;-webkit-user-select:text;user-select:text}
.inp:focus{border-color:var(--cy)}
#onb{position:fixed;inset:0;max-width:480px;margin:0 auto;background:var(--bg);z-index:18;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top)) 18px 24px;display:flex;flex-direction:column;gap:16px}
.miss{border-radius:14px;border:1px solid #1f4a3a;background:#0b1712;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:10px;font-size:13px}
.mck{width:22px;height:22px;border-radius:11px;border:1.5px solid #3a5a4d;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mck.ok{background:var(--gr);border-color:var(--gr);color:#06170d}
.mbtn{height:32px;padding:0 10px;border-radius:8px;background:var(--gr);color:#06170d;font-size:12px;font-weight:700}
.daily{border-radius:14px;border:1px solid var(--ln);background:var(--p3);padding:12px;display:flex;flex-direction:column;gap:8px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.days div{height:52px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px;font-weight:700;text-align:center;line-height:1.1;padding:2px}
.playwrap{position:sticky;bottom:0;padding:10px 12px 12px;margin:0 -12px -22px;background:linear-gradient(180deg,rgba(7,8,12,0),#07080c 30%)}
.chart{border-radius:12px;border:1px solid var(--ln);background:var(--p3);padding:12px;display:flex;flex-direction:column;gap:8px}
.chart svg{display:block;width:100%;height:auto}
.chart rect.hit{fill:transparent;cursor:pointer}
.confetti{position:fixed;top:-10px;width:8px;height:12px;z-index:30;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
/* album */
.chibi{flex-shrink:0}.chibi svg{width:100%;height:100%;display:block}
.ptabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ptabs button{height:46px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:13px;font-weight:700;border:1px solid var(--ln2);background:var(--p1);color:#a9b8cc}
.fig{position:relative;height:146px;border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.fig .rr{font-size:9px;font-weight:700;letter-spacing:.08em}
.fig .nm{font-size:11px;font-weight:700;text-align:center;line-height:1.15;min-height:26px;display:flex;align-items:center}
.fig .x{position:absolute;top:5px;right:5px;min-width:22px;height:18px;padding:0 4px;border-radius:9px;background:#e7b8ff;color:#1a0f24;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.q{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Michroma,sans-serif;font-size:26px;color:#8d9bb0}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 rgba(255,77,141,0)}50%{box-shadow:0 0 18px rgba(255,77,141,.6)}}
.bob{animation:bob 2.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-5px) rotate(3deg)}}
.cheer{animation:cheer 1.2s ease-out both;transform-origin:50% 100%}
@keyframes cheer{20%{transform:translateY(-26px) scale(1.1) rotate(-8deg)}40%{transform:translateY(0) scale(.95)}60%{transform:translateY(-18px) rotate(8deg)}80%,100%{transform:translateY(0)}}
.sad{animation:sad 1.2s ease-in-out both;transform-origin:50% 100%}
@keyframes sad{30%{transform:translateY(6px) rotate(-6deg) scale(.95)}60%{transform:translateY(6px) rotate(6deg) scale(.95)}100%{transform:translateY(4px) scale(.96)}}
.bubble{animation:bubble 1.6s ease-out both}
@keyframes bubble{0%{transform:scale(.4);opacity:0}25%{transform:scale(1.05);opacity:1}85%{opacity:1}100%{opacity:0}}
.pk{height:196px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 4px}
.pkback{border:2px solid #3ff0ff;background:repeating-linear-gradient(45deg,#0f1c2a 0 10px,#0c1622 10px 20px);justify-content:center;gap:6px;color:#3ff0ff;width:100%}
.flip{animation:flip .5s ease-out both}
@keyframes flip{0%{transform:scale(.3) rotateY(90deg);opacity:0}60%{transform:scale(1.1) rotateY(0);opacity:1}100%{transform:scale(1)}}
#sheet{z-index:21;background:rgba(3,4,8,.95)}
#modal{z-index:30}
#sheet .inner{width:100%;max-height:100%;overflow-y:auto}
/* partita */
#gPauseBox{position:absolute;inset:0;z-index:3;background:rgba(3,4,8,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
.hint{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--ln2);background:var(--p1);font-size:12px;color:var(--mu2);line-height:1.4}

#game{position:fixed;inset:0;background:#05070b;z-index:15;touch-action:none}
#gcv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#gPause{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--ln3);background:rgba(14,18,27,.85);color:var(--mu2);font-size:13px;font-weight:600;z-index:2}
</style>
</head>
<body>
<div id="app">
  <div class="top" id="top"></div>
  <div id="main"></div>
  <div class="nav" id="nav"></div>
</div>
<div id="modal" class="veil hidden"></div>
<div id="sheet" class="veil hidden"></div>
<div id="chest" class="veil hidden"></div>
<div id="onb" class="hidden"></div>
<div id="game" class="hidden"><canvas id="gcv"></canvas>
  <button id="gPause" aria-label="Pausa"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1"/><rect x="14" y="4" width="5" height="16" rx="1"/></svg>Pausa</button>
  <div id="gPauseBox" class="hidden"><div class="mi" style="font-size:30px;letter-spacing:.2em;color:var(--cy)">PAUSA</div>
    <div id="gPauseSc" class="mi" style="font-size:18px;color:var(--mu2)"></div>
    <button class="bigbtn" id="gResume" style="width:100%;max-width:320px;background:var(--cy);color:#04161a">Riprendi</button>
    <button class="btn2" id="gQuit" style="width:100%;max-width:320px">Abbandona la partita</button></div>
</div>
<div id="sa" style="position:fixed;left:0;top:0;width:0;height:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);visibility:hidden;pointer-events:none"></div>
<script>
// ════════════════ PONG ARENA · Lobby (versione di prova, da sola) ════════════════
// Tutto il gioco è in questo file. I progressi restano salvati nel browser del telefono.
const BUILD = '28/09 16:30';
const FW = 1.6, FH = 1;
const PX = .06, PT = .028, PL = .24;   // barra: distanza dal bordo, spessore, lunghezza
const BR = .018;                       // raggio pallina
const SPEED0 = .8, SPEEDUP = 1.06, SMAX = 2.2, WIN = 3;
const STEP = 1/120;
const COL = {L:'#3ff0ff', R:'#ff4d8d'};
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const buzz = p => { try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} };
function drawSkinAt(c, id, cx, cy, w, now, col){
  const k = w/TW; c.save(); c.translate(cx, cy); c.scale(k, k);
  if(id === 'base'){ c.fillStyle = col; c.shadowColor = col; c.shadowBlur = 10; rr(c, -TW/2, -TH/2, TW, TH, 4); c.fill(); }
  else { c.shadowColor = skinGlow(id, now); c.shadowBlur = 12; c.drawImage(skinTex(id, now).cv, -TW/2, -TH/2 - TPAD); }
  c.restore();
}

    let g = c.createLinearGradient(0, 0, 0, TH); g.addColorStop(0, '#f6c982'); g.addColorStop(1, '#b36a28');

    c.strokeStyle = '#ffd23a'; c.lineWidth = 3; c.beginPath();
    for(let x = 16, i = 0; x <= TW - 16; x += 10, i++){ const y = TH/2 + (i % 2 ? -4 : 4); i ? c.lineTo(x, y) : c.moveTo(x, y); }
    c.stroke();
  } else if(id === 'baffi'){
    c.fillStyle = '#3b2314';
    for(const d of [-1, 1]){
      const cx = TW/2; c.beginPath(); c.moveTo(cx, TH*.5);
      c.bezierCurveTo(cx + d*40, TH*.05, cx + d*88, TH*1.05, cx + d*110, TH*.4);
      c.bezierCurveTo(cx + d*118, TH*.05, cx + d*108, -TH*.35, cx + d*96, TH*.05);

      c.closePath(); c.fill();
    }
    c.strokeStyle = 'rgba(255,255,255,.18)'; c.lineWidth = 1.5;
    for(const d of [-1, 1]){ c.beginPath(); c.moveTo(TW/2 + d*14, TH*.55); c.quadraticCurveTo(TW/2 + d*55, TH*.4, TW/2 + d*85, TH*.7); c.stroke(); }
    const ng = c.createRadialGradient(TW/2 - 7, -6, 2, TW/2, 2, 24); ng.addColorStop(0, '#ffd4b6'); ng.addColorStop(1, '#d5805f');
    c.fillStyle = ng; c.beginPath(); c.ellipse(TW/2, 1, 19, 18, 0, 0, Math.PI*2); c.fill();
    c.strokeStyle = 'rgba(120,50,30,.5)'; c.lineWidth = 1.2; c.stroke();
    c.fillStyle = '#6b2e22'; c.beginPath(); c.ellipse(TW/2 - 7, 13, 4, 2.4, 0, 0, Math.PI*2); c.ellipse(TW/2 + 7, 13, 4, 2.4, 0, 0, Math.PI*2); c.fill();
    c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.ellipse(TW/2 - 6, -8, 5, 3, -.4, 0, Math.PI*2); c.fill();
  } else if(id === 'oro'){
    const g = c.createLinearGradient(0, 0, 0, TH); g.addColorStop(0, '#fff6c2'); g.addColorStop(.45, '#ffd23a'); g.addColorStop(1, '#a8740a');
    c.beginPath(); c.moveTo(12, 0); c.lineTo(TW - 12, 0); c.lineTo(TW, TH); c.lineTo(0, TH); c.closePath();
    c.fillStyle = g; c.fill(); c.strokeStyle = '#8a5a00'; c.lineWidth = 1.5; c.stroke();
    c.fillStyle = 'rgba(110,70,0,.75)'; c.font = '700 12px ui-monospace,monospace'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('FINE GOLD · 999,9', TW/2, TH/2 + 1);
    c.save(); c.globalCompositeOperation = 'source-atop';
    const sx = ((now/1400) % 1.8 - .4)*TW, sg = c.createLinearGradient(sx - 28, 0, sx + 28, 0);
    sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(.5, 'rgba(255,255,255,.85)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = sg; c.fillRect(0, 0, TW, TH); c.restore();
  } else if(id === 'cometa'){
    const g = c.createLinearGradient(0, 0, TW, 0); g.addColorStop(0, '#fff8e0'); g.addColorStop(.35, '#ffd23a'); g.addColorStop(.75, '#ff8a3d'); g.addColorStop(1, '#ff4d8d');
    rr(c, 0, 0, TW, TH, TH/2); c.fillStyle = g; c.fill();
    c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1.5; c.stroke();
    c.fillStyle = 'rgba(255,255,255,.45)'; rr(c, 12, 3, TW - 24, 5, 2.5); c.fill();
    for(let i = 0; i < 5; i++){ const x = ((now/9 + i*53) % (TW + 40)) - 20, y = 6 + (i*7) % (TH - 12);
      c.fillStyle = 'rgba(255,255,255,.85)'; c.beginPath(); c.arc(x, y, 2, 0, Math.PI*2); c.fill();
      c.fillStyle = 'rgba(255,255,255,.3)'; c.fillRect(x - 16, y - .75, 16, 1.5); }
  } else if(id === 'aura'){
    const g = c.createLinearGradient(0, 0, TW, 0); g.addColorStop(0, '#4b17b8'); g.addColorStop(.5, '#b44dff'); g.addColorStop(1, '#4b17b8');
    c.beginPath(); c.moveTo(0, 0); c.lineTo(TW, 0); c.lineTo(TW - 14, TH/2); c.lineTo(TW, TH); c.lineTo(0, TH); c.lineTo(14, TH/2); c.closePath();
    c.fillStyle = g; c.fill(); c.strokeStyle = '#ffd23a'; c.lineWidth = 2; c.stroke();

    c.shadowColor = '#e7b8ff'; c.shadowBlur = 6 + 4*Math.sin(now/250);

    c.fillStyle = '#ffd23a'; c.font = '14px system-ui,sans-serif'; c.textAlign = 'center';
    const tw = 1 + .25*Math.sin(now/180);
    c.save(); c.translate(38, TH/2); c.scale(tw, tw); c.fillText('✦', 0, 1); c.restore();
    c.save(); c.translate(TW - 38, TH/2); c.scale(2 - tw, 2 - tw); c.fillText('✦', 0, 1); c.restore();
  }
}
// disegna la skin in un riquadro (anteprime del negozio)
function drawSkinPreview(cv, id, now, col){
  const dpr = devicePixelRatio || 1, r = cv.getBoundingClientRect();
  if(cv.width !== Math.round(r.width*dpr)){ cv.width = Math.round(r.width*dpr); cv.height = Math.round(r.height*dpr); }
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, r.width, r.height);
  const k = Math.min((r.width - 16)/TW, r.height/(TH + 2*TPAD));

const FIELD_THEMES = {
  neon:   {floor:'#0b0f17', grid:'rgba(90,110,150,.16)', mid:'rgba(200,210,235,.45)', wall:'rgba(170,180,210,.55)'},
  cibo:   {floor:'#7a1e27', grid:null, mid:'rgba(255,230,200,.6)', wall:'#c8904f'},
  mostri: {floor:'#1a1230', grid:'rgba(181,124,255,.18)', mid:'rgba(200,190,255,.5)', wall:'rgba(157,143,201,.8)'},
  animali:{floor:'#238a47', grid:null, mid:'rgba(255,255,255,.55)', wall:'#8fd46a'},
  star:   {floor:'#120a1f', grid:'rgba(255,77,141,.14)', mid:'rgba(255,255,255,.45)', wall:'#ff4d8d'}
};
// ── Visuale 3D "Tribuna" del telefono ──
// Il telefono vede il campo da dietro la propria barra. Coordinate locali:
// u = posizione laterale (0..FH), z = profondità dalla propria barra (0..FW), h = altezza.
const CAM = {x:FH/2, y:1.7, z:-.45, pitch:1.08}, CP = Math.cos(CAM.pitch), SP = Math.sin(CAM.pitch);
const PADH = .05, CTRL_FRAC = .27;
function shade(hex, f){ const n = parseInt(hex.slice(1), 16); return `rgb(${(n >> 16)*f|0},${((n >> 8) & 255)*f|0},${(n & 255)*f|0})`; }
// Visuale 3D "Tribuna" dal lato di un giocatore. La usano i telefoni e i riquadri sul PC.
class Field3D {
  constructor(side){ this.side = side; this.rect = {x:0, y:0, w:1, h:1}; this.k = 1; this.ox = 0; this.oy = 0; }
  u(y){ return this.side === 'L' ? y : FH - y; }   // y del mondo → posizione laterale (e viceversa)
  z(x){ return this.side === 'L' ? x : FW - x; }   // x del mondo → profondità dalla propria barra
  raw(u, h, z){ const dx = u - CAM.x, dy = h - CAM.y, dz = z - CAM.z, zc = dz*CP - dy*SP, yc = dy*CP + dz*SP; return [dx/zc, -yc/zc, zc]; }
  P(u, h, z){ const [a, b, zc] = this.raw(u, h, z); return [this.ox + a*this.k, this.oy + b*this.k, zc]; }
  fit(x, y, w, h, top){
    const pts = [this.raw(0,0,0), this.raw(FH,0,0), this.raw(0,0,FW), this.raw(FH,0,FW)];
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]), m = 10, sm = Math.max(10, w*.04);
    const minY = Math.min(...ys), maxY = Math.max(...ys), minX = Math.min(...xs), maxX = Math.max(...xs);
    this.k = Math.min((h - top - m)/(maxY - minY), (w - 2*sm)/(pts[1][0] - pts[0][0]), (w - 2*m)/(pts[3][0] - pts[2][0]));
    this.ox = x + w/2 - (minX + maxX)/2*this.k; this.oy = y + h - m - maxY*this.k;
    this.rect = {x, y, w, h};
  }
  poly(c, pts, fill, stroke){
    c.beginPath(); pts.forEach((p, i) => { const q = this.P(...p); i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]); });
    c.closePath(); if(fill){ c.fillStyle = fill; c.fill(); } if(stroke){ c.strokeStyle = stroke; c.stroke(); }
  }
  line(c, a, b, col, w){ const p = this.P(...a), q = this.P(...b); c.strokeStyle = col; c.lineWidth = w; c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(q[0], q[1]); c.stroke(); }
  texQuad(c, tex, A, B, Cc, dark, coreOnly){
    const p = this.P(...A), q = this.P(...B), r = this.P(...Cc);
    c.save(); c.transform((q[0] - p[0])/TW, (q[1] - p[1])/TW, (r[0] - p[0])/TH, (r[1] - p[1])/TH, p[0], p[1]);
    if(coreOnly) c.drawImage(tex.cv, 0, TPAD, TW, TH, 0, 0, TW, TH); else c.drawImage(tex.cv, 0, -TPAD);
    if(dark){ c.shadowBlur = 0; c.fillStyle = `rgba(0,0,0,${dark})`; c.fillRect(0, 0, TW, TH); }
    c.restore();
  }
  box(c, u, z, col, bright, skin, now, flip, len){
    const x0 = u - (len || PL)/2, x1 = u + (len || PL)/2, z0 = z - PT/2, z1 = z + PT/2, h = PADH;
    if(skin && skin !== 'base'){
      const tex = skinTex(skin, now);
      c.shadowBlur = 0;
      if(CAM.x < x0) this.poly(c, [[x0,0,z0],[x0,h,z0],[x0,h,z1],[x0,0,z1]], 'rgba(15,15,22,.95)');
      if(CAM.x > x1) this.poly(c, [[x1,0,z0],[x1,h,z0],[x1,h,z1],[x1,0,z1]], 'rgba(15,15,22,.95)');
      this.texQuad(c, tex, [x0,h,z0], [x1,h,z0], [x0,0,z0], .45, true);
      c.shadowColor = skinGlow(skin, now); c.shadowBlur = bright ? 16 : 8;
      if(flip) this.texQuad(c, tex, [x1,h,z0], [x0,h,z0], [x1,h,z1]);
      else this.texQuad(c, tex, [x0,h,z1], [x1,h,z1], [x0,h,z0]);
      c.shadowBlur = 0; return;
    }
    c.shadowColor = col; c.shadowBlur = bright ? 18 : 8;
    if(CAM.x < x0) this.poly(c, [[x0,0,z0],[x0,h,z0],[x0,h,z1],[x0,0,z1]], shade(col, .55));
    if(CAM.x > x1) this.poly(c, [[x1,0,z0],[x1,h,z0],[x1,h,z1],[x1,0,z1]], shade(col, .55));
    this.poly(c, [[x0,h,z0],[x1,h,z0],[x1,h,z1],[x0,h,z1]], col);
    this.poly(c, [[x0,0,z0],[x1,0,z0],[x1,h,z0],[x0,h,z0]], shade(col, .78));
    c.shadowBlur = 0;
  }
  // st: {ball:{x,y}|null, trail:[[x,y]], myY, oppY, showOpp, ph, cd, msg:[riga1, riga2]|null, hint}
  draw(c, st, now){
    const {x, y, w, h} = this.rect, me = this.side, opp = me === 'L' ? 'R' : 'L';
    c.save(); c.beginPath(); c.rect(x, y, w, h); c.clip();
    const bg = c.createLinearGradient(0, y, 0, y + h); bg.addColorStop(0, '#07080c'); bg.addColorStop(1, '#0d1018');
    c.fillStyle = bg; c.fillRect(x, y, w, h);
    const hz = this.P(FH/2, 0, FW), glow = c.createRadialGradient(hz[0], hz[1], 0, hz[0], hz[1], w*.8);
    glow.addColorStop(0, COL[opp] + '29'); glow.addColorStop(1, COL[opp] + '00');
    c.fillStyle = glow; c.fillRect(x, y, w, h);
    const T = FIELD_THEMES[st.theme] || FIELD_THEMES.neon;   // campi a tema dell'album
    this.poly(c, [[0,0,0],[FH,0,0],[FH,0,FW],[0,0,FW]], T.floor);
    if(st.theme === 'cibo'){   // tovaglia a quadri
      const n = 8, m = 13;
      for(let i = 0; i < n; i++) for(let j = 0; j < m; j++) if((i + j) % 2) this.poly(c, [[i*FH/n,0,j*FW/m],[(i+1)*FH/n,0,j*FW/m],[(i+1)*FH/n,0,(j+1)*FW/m],[i*FH/n,0,(j+1)*FW/m]], '#4a1218');
    } else if(st.theme === 'animali'){   // erba a strisce
      for(let j = 0; j < 16; j += 2) this.poly(c, [[0,0,j*FW/16],[FH,0,j*FW/16],[FH,0,(j+1)*FW/16],[0,0,(j+1)*FW/16]], '#1d6e39');
    } else if(st.theme === 'star'){   // luci del palco
      for(const [u, z, col] of [[.25, FW*.7, 'rgba(255,77,141,.28)'], [.75, FW*.35, 'rgba(63,240,255,.22)']]){
        const q = this.P(u, 0, z), g = c.createRadialGradient(q[0], q[1], 0, q[0], q[1], w*.35); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
        c.fillStyle = g; c.fillRect(x, y, w, h);
      }
    } else if(st.theme === 'mostri'){   // ragnatele negli angoli lontani
      for(const u0 of [0, FH]){ const sgn = u0 ? -1 : 1;
        for(let k = 1; k <= 3; k++) this.line(c, [u0, 0, FW - .12*k], [u0 + sgn*.12*k, 0, FW], 'rgba(200,190,255,.35)', 1);
        this.line(c, [u0, 0, FW], [u0 + sgn*.3, 0, FW - .3], 'rgba(200,190,255,.35)', 1); }
    }
    if(T.grid){
      for(let z = .2; z < FW; z += .2) this.line(c, [0,0,z], [FH,0,z], T.grid, 1);
      for(const u of [.25, .5, .75]) this.line(c, [u,0,0], [u,0,FW], T.grid, 1);
    }
    for(let u = 0; u < FH; u += .08) this.line(c, [u + .01,0,FW/2], [u + .05,0,FW/2], T.mid, 2);
    const wh = .035;
    this.poly(c, [[0,0,0],[0,wh,0],[0,wh,FW],[0,0,FW]], 'rgba(120,130,160,.10)');
    this.poly(c, [[FH,0,0],[FH,wh,0],[FH,wh,FW],[FH,0,FW]], 'rgba(120,130,160,.10)');
    this.line(c, [0,wh,0], [0,wh,FW], T.wall, 2); this.line(c, [FH,wh,0], [FH,wh,FW], T.wall, 2);
    this.line(c, [0,0,FW], [FH,0,FW], COL[opp] + '80', 2); this.line(c, [0,0,0], [FH,0,0], COL[me] + '80', 2);
    const drawBall = () => {
      if(!st.ball) return;
      const u = this.u(st.ball.y), z = this.z(st.ball.x);
      const sh = this.P(u, 0, z), b = this.P(u, BR, z), r = Math.max(2, BR*this.k/b[2]);
      c.fillStyle = 'rgba(0,0,0,.55)'; c.beginPath(); c.ellipse(sh[0], sh[1], r*1.1, r*.45, 0, 0, Math.PI*2); c.fill();
      (st.trail || []).forEach(([tx, ty], i, a) => { const q = this.P(this.u(ty), BR, this.z(tx)); c.fillStyle = st.trailCol ? st.trailCol(i, a.length) : `rgba(255,255,255,${i/a.length*.18})`; c.beginPath(); c.arc(q[0], q[1], r*.7, 0, Math.PI*2); c.fill(); });
      const g = c.createRadialGradient(b[0] - r*.35, b[1] - r*.35, r*.1, b[0], b[1], r);
      g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#b9c2d6');
      c.fillStyle = g; c.shadowColor = '#fff'; c.shadowBlur = 10; c.beginPath(); c.arc(b[0], b[1], r, 0, Math.PI*2); c.fill(); c.shadowBlur = 0;
    };
    if(st.showOpp) this.box(c, this.u(st.oppY), FW - PX, COL[opp], false, st.oppSkin, now, true, st.oppLen);
    const bz = st.ball ? this.z(st.ball.x) : 1;
    if(bz > PX){ drawBall(); this.box(c, this.u(st.myY), PX, COL[me], true, st.mySkin, now, false, st.myLen); }
    else { this.box(c, this.u(st.myY), PX, COL[me], true, st.mySkin, now, false, st.myLen); drawBall(); }
    const mid = this.P(FH/2, 0, FW/2);
    c.textAlign = 'center'; c.textBaseline = 'middle';
    if(st.ph === 'cd' && st.cd > 0){
      c.fillStyle = '#fff'; c.font = `700 ${Math.round(w*.16)}px "Chakra Petch", monospace`; c.fillText(Math.ceil(st.cd/1000), mid[0], mid[1] - w*.08);
      if(st.hint){ c.font = `500 ${Math.round(w*.036)}px system-ui,sans-serif`; c.fillStyle = '#c3c9d6'; c.fillText(st.hint, mid[0], mid[1] + w*.06); }
    }
    if(st.msg){
      c.font = `600 ${Math.round(w*.05)}px system-ui,sans-serif`; c.fillStyle = '#e8ecf4'; c.fillText(st.msg[0], mid[0], mid[1] - w*.04);
      c.font = `500 ${Math.round(w*.038)}px system-ui,sans-serif`; c.fillStyle = '#8b93a7'; c.fillText(st.msg[1], mid[0], mid[1] + w*.03);
    }
    c.restore();
  }
}

function rr(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

// ── Logo HUD ──
function spaced(c, text, cx, y, ls){
  const ws = [...text].map(ch => c.measureText(ch).width), tot = ws.reduce((a, b) => a + b, 0) + ls*(text.length - 1);
  let x = cx - tot/2; c.textAlign = 'left'; [...text].forEach((ch, i) => { c.fillText(ch, x, y); x += ws[i] + ls; }); c.textAlign = 'center';
}
function logoHud(c, cx, oy, W, H, now, label){
  // logo PONG ARENA: cornice da visore e colori leggermente sdoppiati (niente disturbi)
  c.save(); c.translate(0, oy); c.textBaseline = 'middle'; c.textAlign = 'center';
  c.font = '100px "Michroma", sans-serif';
  const sz = 100*W*.66/(c.measureText('PONG').width + 12*3), ls = sz*.12, y = H*.42, off = Math.max(1, W*.004);
  c.font = `${sz}px "Michroma", sans-serif`;
  c.save(); c.globalCompositeOperation = 'lighter';
  c.fillStyle = 'rgba(255,77,141,.9)'; spaced(c, 'PONG', cx - off, y, ls);
  c.fillStyle = 'rgba(63,240,255,.9)'; spaced(c, 'PONG', cx + off, y, ls);
  c.restore();
  c.fillStyle = '#f2f6ff'; spaced(c, 'PONG', cx, y, ls);
  const fx = cx - W*.42, fy = H*.08, fw = W*.84, fh = H*.66, L = Math.max(10, W*.05);
  c.strokeStyle = '#3ff0ff'; c.lineWidth = 2; c.lineCap = 'square';
  for(const [x, y2, dx, dy] of [[fx, fy, 1, 1], [fx + fw, fy, -1, 1], [fx, fy + fh, 1, -1], [fx + fw, fy + fh, -1, -1]]){
    c.beginPath(); c.moveTo(x, y2 + dy*L); c.lineTo(x, y2); c.lineTo(x + dx*L, y2); c.stroke(); }
  const s2 = W*.045; c.font = `${s2}px "Michroma", sans-serif`; c.fillStyle = '#ff4d8d';
  spaced(c, 'ARENA', cx, fy + fh, s2*1.2);
  c.font = `700 ${Math.max(10, W*.03)}px "Chakra Petch", monospace`; c.fillStyle = 'rgba(191,248,255,.75)'; c.textAlign = 'left';
  c.fillText(label, fx, H*.94);
  c.textAlign = 'right'; c.fillStyle = (now % 1000) < 600 ? '#ff4d8d' : 'rgba(255,77,141,.3)';
  c.fillText('● LIVE', fx + fw, H*.94);
  c.restore();
}


// ════════════════ Dati del gioco ════════════════
// La progressione è compressa in poche partite, per farla vivere in pochi minuti:
// fase 0 = la festa (partite 1-3), fase 1 = l'aggancio (4-6), fase 2 = il muro (dalla 7).

function renderModal(){

  if(!MOD){ el.classList.add('hidden'); el.innerHTML = ''; return; }
  const col = MOD.color || '#e8f4ff';
  el.innerHTML = `<div class="modal" style="border-color:${MOD.color || '#2d3749'};box-shadow:0 0 30px ${MOD.color ? MOD.color + '33' : 'transparent'}">

    ${(MOD.lines || []).map(l => `<div class="l">${esc(l)}</div>`).join('')}
    ${MOD.note ? `<div class="nt">${esc(MOD.note)}</div>` : ''}
    ${MOD.primary ? `<button class="bigbtn" id="mP" style="background:${MOD.primary.bg || '#3ff0ff'};color:#07080c">${esc(MOD.primary.label)}</button>` : ''}
    ${MOD.secondary ? `<button class="btn2" id="mS">${esc(MOD.secondary.label)}</button>` : ''}
  </div>`;
  el.classList.remove('hidden');
  const m = MOD;
  if(m.primary) $('#mP').onclick = () => m.primary.fn();
  if(m.secondary) $('#mS').onclick = () => m.secondary.fn();
  if(m.confetti){ m.confetti = false; confetti(); }
}
function confetti(n = 46){
  const cols = ['#3ff0ff', '#ff4d8d', '#ffc94d', '#5dffa0', '#b57cff'], box = $('#app').getBoundingClientRect();
  for(let i = 0; i < n; i++){
    const d = document.createElement('div'); d.className = 'confetti';
    d.style.left = (box.left + Math.random()*box.width) + 'px'; d.style.background = cols[i % cols.length];
    d.style.animationDelay = (Math.random()*.5) + 's'; d.style.animationDuration = (1.4 + Math.random()*1.2) + 's';
    document.body.appendChild(d); setTimeout(() => d.remove(), 3200);
  }
  buzz([20, 30, 20]);
}

function spend(kind, label, n, give){

function chestRoll(k){
  const [c0, c1, f0, f1] = CHEST_R[phase()][k], out = [{t:'coins', n:rnd(c0, c1)}, {t:'frag', n:rnd(f0, f1)}];
  if(k === 'Oro' && Math.random() < .05 && !S.cosOwned.s_cometa) out.push({t:'cos', id:'s_cometa'});
  else if(k === 'Oro') out.push({t:'gems', n:rnd(3, 8)});
  out.push({t:'fig', id:rollFig(ODDS[k])});                  // figurine: 1 nel baule d'argento, 2 in quello d'oro
  if(k === 'Oro') out.push({t:'fig', id:rollFig(ODDS[k])});
  return out;
}
let chestTimers = [];
function openChestAnim(k, o = {}){
  const list = o.list || chestRoll(k);
  if(o.free === false) list.forEach(apply); else gain(list);
  done('chest'); save(); render();
  const gold = k === 'Oro', col = gold ? '#ffc94d' : '#c9d3e0', glow = gold ? 'rgba(255,201,77,.35)' : 'rgba(201,211,224,.3)';
  const el = $('#chest');
  el.innerHTML = `<div class="mi" style="font-size:18px;color:${col};text-align:center">${esc(o.title || CHEST_NAME(k))}</div>
    <div class="cstage"><div id="cfx"></div>
      <div class="cbody shake" id="cbody">
        <div class="lid" id="clid" style="${gold ? 'background:#ffc94d;border:2px solid #fff1b0' : 'background:#c9d3e0;border:2px solid #eef3fa'}"></div>
        <div class="cbase" style="${gold ? 'background:#b07a14;border:2px solid #ffc94d;box-shadow:0 0 24px rgba(255,201,77,.45)' : 'background:#6f7c90;border:2px solid #c9d3e0;box-shadow:0 0 24px rgba(201,211,224,.3)'}"></div>
        <div class="lock" style="border:2px solid ${col}"></div>
      </div></div>
    <div class="g3" id="crw" style="width:100%;min-height:104px"></div>
    <button class="bigbtn hidden" id="cOk" style="width:100%;background:${col};color:#07080c">Fantastico!</button>
    <button class="btn2" id="cSkip" style="width:100%">Tocca per saltare</button>`;
  el.classList.remove('hidden'); buzz([10, 40, 10, 40, 10]);
  let shown = 0, opened = false;
  const reveal = () => {
    if(shown >= list.length) return;
    const r = list[shown++], c = r.t === 'coins' ? '#ffc94d' : r.t === 'gems' ? '#5cf2ff' : r.t === 'frag' ? '#3ff0ff' : '#ff8fb6';
    const skin = r.t === 'cos' && cos(r.id).cat === 'skin';
    if(r.t === 'fig'){
      const f = ch(r.id), fr = RAR[f.r];
      $('#crw').insertAdjacentHTML('beforeend', `<div class="rw" style="height:auto;min-height:100px;border:1px solid ${fr.c};box-shadow:0 0 14px ${fr.c}40">${chibiHtml(r.id, 50)}<span style="font-size:13px;font-weight:700;color:${r.isNew ? '#5dffa0' : '#e7b8ff'}">${r.isNew ? 'NUOVA!' : '+' + r.dup + ' brill.'}</span><span style="font-size:10px;color:#c9d3e0">${esc(f.name)}</span></div>`);
      buzz(f.r === 'L' ? [30, 40, 60] : 15);
      if(shown >= list.length){ $('#cOk').classList.remove('hidden'); $('#cSkip').classList.add('hidden'); }
      return;
    }
    const ico = r.t === 'coins' ? I.coin(26) : r.t === 'gems' ? I.gem(26) : r.t === 'frag' ? I.frag(26) : r.t === 'ava' ? avaHtml(r.id, 34) : skin ? padCanvas(r.id, 80, 26) : `<div class="sw" style="${cos(r.id).sw}"></div>`;
    const big = r.t === 'cos' || r.t === 'ava' ? 'NUOVO!' : '+' + num(r.n), small = r.t === 'coins' ? 'monete' : r.t === 'gems' ? 'gemme' : r.t === 'frag' ? 'frammenti di barra' : rlabel(r);
    $('#crw').insertAdjacentHTML('beforeend', `<div class="rw" style="border:1px solid ${c};box-shadow:0 0 14px ${c}40">${ico}<span style="font-size:18px;font-weight:700;color:${c}">${big}</span><span style="font-size:11px;color:#c9d3e0">${esc(small)}</span></div>`);
    buzz(15);
    if(shown >= list.length){ $('#cOk').classList.remove('hidden'); $('#cSkip').classList.add('hidden'); }
  };
  const open = () => {
    if(opened) return; opened = true;
    $('#cbody').classList.remove('shake'); $('#clid').classList.add('fly');
    $('#cfx').innerHTML = `<div class="rays" style="background:repeating-conic-gradient(${glow} 0 10deg,transparent 10deg 30deg)"></div><div class="burst" style="background:${col}"></div>`;
    buzz(60);
  };
  const stop = () => { chestTimers.forEach(t => { clearTimeout(t); clearInterval(t); }); chestTimers = []; };
  stop();
  chestTimers.push(setTimeout(() => { open(); chestTimers.push(setInterval(() => { reveal(); if(shown >= list.length) stop(); }, 480)); }, 1200));
  $('#cSkip').onclick = () => { stop(); open(); while(shown < list.length) reveal(); };
  $('#cOk').onclick = () => { stop(); el.classList.add('hidden'); el.innerHTML = ''; render(); if(o.after) o.after(); flushPending(); };
}
function clickChest(i){
  const c = S.chests[i], st = chestState(c), now = Date.now();
  if(st === 'empty') return openModal({title:'Slot libero', lines:['Vinci una partita per guadagnare un baule.'], primary:{label:'Ok', fn:closeModal}});
  if(st === 'ready'){ S.chests[i] = {k:'', st:'empty'}; return openChestAnim(c.k); }
  const busy = S.chests.some(o => chestState(o) === 'unlocking');
  const rem = st === 'unlocking' ? c.end - now : CHEST_MS[phase()][c.k], cost = Math.max(1, Math.ceil(rem/600000));
  if(st === 'locked' && !busy){ c.st = 'unlocking'; c.end = now + CHEST_MS[phase()][c.k]; return commit(); }
  openModal({title:st === 'unlocking' ? 'Non vuoi aspettare?' : 'Un baule alla volta', color:'#5cf2ff',
    lines:[st === 'unlocking' ? 'Il baule si apre tra ' + dur(rem) + '.' : 'Stai già sbloccando un altro baule.', 'Aprilo subito per ' + cost + (cost === 1 ? ' gemma.' : ' gemme.')],
    primary:{label:'Apri per ' + cost + (cost === 1 ? ' gemma' : ' gemme'), bg:'#5cf2ff', fn:() => {
      if(S.gems < cost) return spend('gems', 'Apertura immediata', cost, () => {});
      closeModal(); S.gems -= cost; S.chests[i] = {k:'', st:'empty'}; openChestAnim(c.k);
    }},
    secondary:{label:'Aspetto', fn:closeModal}});
}

const A = {

  daily(i){
    const d = DAILY[i], r = d.r[0];

    spend(d.coins ? 'coins' : 'gems', d.label, d.coins || d.gems, () => { d.r.forEach(apply); S.bought[d.id] = 1; openModal(rewardModal('Offerta del giorno', d.r)); });
  },

  coins(i){ const k = COINPACKS[i]; spend('gems', num(k.n) + ' monete', k.g, () => { S.coins += k.n; }); },

    if(o.pass) return openModal({title:'Premio del Pass Premium', color:'#ffc94d', lines:[rlabel({t:'cos', id}) + ' si ottiene solo con il Pass Premium.'],

      primary:{label:'Trovali nel negozio', bg:'#ff4d8d', fn:() => { closeModal(); A.tab('shop'); }}, secondary:{label:'Chiudi', fn:closeModal}});
    if(S.coins < cost) return spend('coins', 'Potenziamento barra', cost, () => {});
    b.frag -= need; b.lvl++; S.coins -= cost; done('up'); commit(); buzz([20, 40, 60]);
    const l = ['Lunghezza: +' + LEN[b.lvl] + '%', 'Velocità: +' + SPD[b.lvl] + '%'];
    if(b.lvl === 3) l.push('Sbloccato: 1 colpo potente a partita');

  },
  mission(id){
    const m = MISS.find(x => x.id === id); if(!m || !S.mdone[id] || S.mclaim[id]) return;

  },
  gift(){

    let r = DAYS[st.cur]; if(r.t === 'cos' && S.cosOwned[r.id]) r = {t:'gems', n:100};
    S.streak = {n:st.cur + 1, last:dayKey()}; gain([r]); commit();

  premium(){ if(S.premium) return; pay('Pass Arena Premium', 4.99, () => { S.premium = true; }); },

  page(i){ S.albumPage = i; commit(); },
  fig(id){ figSheet(id); },
  preview(){ previewSheet(); },
  pack(paid){
    if(paid) return pay('Bustina «Leggenda garantita»', LEGEND_EUR, () => packSheet(true), true);
    spend('gems', 'Bustina di figurine', PACK_GEMS, () => packSheet(false));
  },
  field(id){
    const i = FIELDS.findIndex(f => f.id === id);
    if(i > 0 && !S.pagesDone[i - 1]) return openModal({title:'Campo ' + FIELDS[i].name, lines:['Si sblocca completando la pagina ' + PAGES[i - 1].name + ' dell\'album.'], primary:{label:'Vai all\'album', fn:() => { closeModal(); S.albumPage = i - 1; A.tab('album'); }}, secondary:{label:'Chiudi', fn:closeModal}});
    S.field = id; commit();
  },
  title(){ const t = PAGES.filter((P, i) => S.pagesDone[i]).map(P => P.titolo); if(t.length < 2) return; S.title = t[(t.indexOf(S.title) + 1) % t.length]; commit(); },
  nextDay(){ S.dayShift = (S.dayShift || 0) + 1; commit(); },
  skipDay(){ S.dayShift = (S.dayShift || 0) + 2; commit(); }
};
function dailyState(){
  const today = dayKey(), yest = dayKey(-1), k = S.streak;
  const claimed = k.last === today, broken = !claimed && k.last && k.last !== yest;
  const cur = claimed ? k.n - 1 : broken ? 0 : k.n % 7;
  return {claimed, broken:broken && k.n > 0, cur};
}

      <path d="${path}" fill="${sel ? '#a5f8ff' : '#3ff0ff'}"/>
      <text x="${x + bw/2}" y="${base + 14}" fill="#8d9bb0" font-size="9" text-anchor="middle">${off + i + 1}</text>
      <text x="${x + bw/2}" y="${base + 26}" fill="${e.win ? '#c9d3e0' : '#5b677a'}" font-size="9" text-anchor="middle" font-weight="700">${e.win ? 'V' : 'P'}</text>
      <rect class="hit" x="${x0 + i*slot}" y="0" width="${slot}" height="${H}" onclick="A.bar(${off + i})"><title>Partita ${off + i + 1}: ${num(e.v)} monete</title></rect>`;
  }).join('');
  const s = chartSel >= 0 && S.log[chartSel];
  return `<div class="chart"><span style="font-size:13px;font-weight:700">Premi ricevuti per partita</span>

// timer che scorrono (senza ridisegnare tutta la pagina)
let sig = '';
function tick(force){
  const now = Date.now();
  if(S.day !== dayKey()){ S.day = dayKey(); for(const k of Object.keys(S.bought)) if(k.startsWith('d_')) delete S.bought[k]; save(); if(!force) return render(); }
  const s2 = S.chests.map(chestState).join() + Object.keys(OFFERS).map(offerOn).join();
  if(!force && s2 !== sig){ sig = s2; return render(); }
  sig = s2;
  document.querySelectorAll('[data-t]').forEach(el => {
    const t = el.dataset.t;
    el.textContent = t.startsWith('o_') ? clock(S.offers[t.slice(2)] - now) : t === 'daily' ? clock(new Date(now).setHours(24, 0, 0, 0) - now)
      : t === 'pass' ? days(S.t0 + (12*24 + 4)*3600e3 - now) : dur((S.chests[+t.slice(1)] || {}).end - now);
  });
}

  e.preventDefault();
  if(inPw(x, y)) return armPower();
  gcv.setPointerCapture(e.pointerId); pad = {id:e.pointerId, lx:x, finger:[x, y], touched:true};
});
gcv.addEventListener('pointermove', e => {
  if(pad.id !== e.pointerId) return; const r = gcv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  G.myT = clamp(G.myT + (x - pad.lx)/(V.w - 40)*1.3*(FH - G.len), G.len/2, FH - G.len/2); pad.lx = x; pad.finger = [x, y];
});
const padUp = e => { if(pad.id === e.pointerId){ pad.id = null; pad.finger = null; } };
gcv.addEventListener('pointerup', padUp); gcv.addEventListener('pointercancel', padUp);
addEventListener('keydown', e => { if(!G.on) return; if(e.key === 'Escape' || e.key === 'p'){ G.paused ? resume() : pause(); return; } G.keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = true; if(e.key === ' '){ e.preventDefault(); armPower(); } });
addEventListener('keyup', e => { if(G.on) G.keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false; });
function pause(){
  if(!G.on || G.paused || G.ph === 'over') return;
  G.paused = true; G.pauseT = performance.now(); pad = {id:null, lx:0, finger:null, touched:pad.touched};
  $('#gPauseSc').textContent = G.sc[0] + ' – ' + G.sc[1];
  $('#gPauseBox').classList.remove('hidden');
}
function resume(){
  if(!G.paused) return;
  const now = performance.now();
  if(G.ph === 'cd') G.phEnd += now - G.pauseT;
  else if(G.ph === 'play'){ G.pend = {vx:G.ball.vx, vy:G.ball.vy}; G.ball.vx = G.ball.vy = 0; G.ph = 'cd'; G.phEnd = now + 1500; }   // riparte dopo un breve conto alla rovescia
  G.paused = false; G.last = now; $('#gPauseBox').classList.add('hidden');
}
$('#gPause').onclick = pause;
$('#gResume').onclick = resume;
$('#gQuit').onclick = () => openModal({title:'Abbandonare?', lines:['Abbandonare la partita conta come sconfitta.'], primary:{label:'Abbandona', bg:'#ff4d8d', fn:() => { closeModal(); endMatch(true); }}, secondary:{label:'Continua a giocare', fn:closeModal}});
document.addEventListener('visibilitychange', () => { if(document.hidden) pause(); });   // se esci dall'app o arriva una chiamata, la partita si ferma
// schermo intero: dove il browser lo permette (Android). Su iPhone serve "Aggiungi alla schermata Home".
const STANDALONE = matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
function goFull(){
  if(STANDALONE || document.fullscreenElement) return;
  const el = document.documentElement, rq = el.requestFullscreen || el.webkitRequestFullscreen;
  if(rq && matchMedia('(pointer: coarse)').matches){ try{ const p = rq.call(el, {navigationUI:'hide'}); if(p && p.catch) p.catch(() => {}); }catch(e){} }
}
function endMatch(quit){
  if(!G.on) return;
  G.on = false; $('#game').classList.add('hidden');
  const win = !quit && G.win, sc = G.sc.slice(), ph = phase(), R = win ? WINR[ph] : LOSSR[ph];
  S.matches++; done('play');
  const got = [];
  let lines, note = '';
  if(win){
    S.wins++; S.trophies += R.tro; got.push({t:'coins', n:R.coins});
    lines = ['+' + R.tro + ' trofei', '+' + R.coins + ' monete', '+' + R.pass + ' punti Pass'];
    const drop = ph < 2 || Math.random() < .5, slot = S.chests.findIndex(c => c.st === 'empty');
    if(drop && slot >= 0){ const k = Math.random() < (ph === 0 ? .4 : .2) ? 'Oro' : 'Argento'; S.chests[slot] = {k, st:'locked'}; lines.push(CHEST_NAME(k) + ' ottenuto!'); }
    else if(drop) note = 'Slot bauli pieni: questo baule è andato perso. Aprine uno per liberare spazio.';
  } else {
    S.trophies = Math.max(0, S.trophies - R.tro);
    lines = ['-' + R.tro + ' trofei', '+' + R.pass + ' punti Pass'];
  }
  gain(got); S.passXp = Math.min(1000, S.passXp + R.pass);
  // esperienza e livelli (all'inizio si sale quasi a ogni partita)
  S.xp += R.xp; const ups = [];
  while(S.xp >= XPN(S.lvl)){ S.xp -= XPN(S.lvl); S.lvl++; const r = LVLR(S.lvl); gain(r); ups.push([S.lvl, r]); }
  // traguardi dei trofei
  const roads = [];
  while(S.road < ROAD.length && S.trophies >= ROAD[S.road][0]){ gain([ROAD[S.road][1]]); roads.push(ROAD[S.road]); S.road++; }
  // offerte "al momento giusto"
  let offer = '';
  if(!S.offers.boost && ((!win && S.matches >= 4) || S.matches >= 7)){ S.offers.boost = Date.now() + OFFERS.boost.min*60e3; offer = 'boost'; }
  else if(!S.offers.cometa && S.lvl >= 4){ S.offers.cometa = Date.now() + OFFERS.cometa.min*60e3; offer = 'cometa'; }
  S.log.push({v:S.cur, win, offer:!!offer}); S.cur = 0;
  S.tab = 'lobby'; commit(); $('#main').scrollTop = 0;
  const hard = !win && ph > 0 && S.bar.lvl < 5;
  openModal({title:(win ? 'VITTORIA ' : quit ? 'ABBANDONATA ' : 'SCONFITTA ') + sc[0] + '–' + sc[1], color:win ? '#3ff0ff' : '#ff8fb6', lines,
    note:note || (hard ? 'Il tuo avversario aveva una barra di livello più alto.' : ''), confetti:win && ph === 0,
    primary:hard ? {label:'Potenzia la barra', bg:'#5dffa0', fn:() => { MODQ = MODQ.filter(m => m.keep); closeModal(); S.barTab = 'up'; A.tab('bars'); }} : {label:'Continua', fn:closeModal},
    secondary:hard ? {label:'Continua', fn:closeModal} : null});
  for(const [l, r] of ups) enqueue({title:'LIVELLO ' + l + '!', color:'#3ff0ff', lines:r.map(rlabel), confetti:true, keep:true, primary:{label:'Evviva!', fn:closeModal}});
  for(const [t, r] of roads) enqueue({title:'Traguardo ' + t + ' trofei', color:'#ffc94d', lines:[rlabel(r)], keep:true, primary:{label:'Fantastico!', fn:closeModal}});
  flushPending();
  if(offer){ const o = OFFERS[offer]; enqueue({title:offer === 'boost' ? 'Sei bloccato?' : 'Offerta speciale!', color:'#ff8fb6', keep:true,
    lines:[o.title, o.desc, '€ ' + eu(o.price) + (o.was ? ' invece di € ' + eu(o.was) : '')], note:'Solo per i prossimi ' + (o.min >= 60 ? o.min/60 + ' ore' : o.min + ' minuti') + '.',
    primary:{label:'Compra · € ' + eu(o.price), bg:'#ff4d8d', fn:() => { closeModal(); A.offer(offer); }}, secondary:{label:'No, grazie', fn:closeModal}}); }
}

// ════════════════ Avvio ════════════════
function loop(now){ if(!G.on) drawPreviews(now); requestAnimationFrame(loop); }
render(); requestAnimationFrame(loop);
if(!S.name) openProfileEditor(true);
if(document.fonts) document.fonts.ready.then(() => { for(const k in texCache) texCache[k].at = -1; });
</script>
</body>
